<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة — نيلوس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<!-- ===== Login gate ===== -->
<div class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <span class="logo-text admin-logo">نيلوس</span>
    <h1>لوحة الإدارة</h1>
    <p>الصفحة دي لفريق العمل بس. اكتب كلمة السر للمتابعة.</p>
    <input type="password" id="loginPassword" placeholder="كلمة السر" autocomplete="current-password" required>
    <p class="login-error" id="loginError"></p>
    <button type="submit" class="btn btn-primary">دخول</button>
    <!-- <p class="login-hint">كلمة السر الافتراضية: <code>nilus2026</code></p> -->
  </form>
</div>

<!-- ===== Dashboard ===== -->
<div class="admin-app" id="adminApp" hidden>

  <header class="admin-header">
    <div class="admin-header-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="30" height="30" fill="none">
            <path d="M6 34c4-10 10-18 18-18s14 8 18 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="24" cy="14" r="4.5" stroke="currentColor" stroke-width="2.5"/>
            <path d="M6 34h36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="logo-text">نيلوس <small>· الإدارة</small></span>
      </a>
      <button class="btn btn-ghost" id="logoutBtn">خروج</button>
    </div>
  </header>

  <main class="admin-main">

    <section class="admin-stats">
      <div class="admin-stat-card">
        <span id="statTotal">0</span>
        <p>إجمالي الحجوزات</p>
      </div>
      <div class="admin-stat-card">
        <span id="statPending">0</span>
        <p>قيد المراجعة</p>
      </div>
      <div class="admin-stat-card">
        <span id="statConfirmed">0</span>
        <p>مؤكدة</p>
      </div>
      <div class="admin-stat-card">
        <span id="statPeople">0</span>
        <p>إجمالي المسافرين</p>
      </div>
    </section>

    <section class="admin-toolbar">
      <div class="toolbar-left">
        <input type="search" id="searchInput" placeholder="دور بالاسم أو رقم الموبايل أو رقم الحجز…">
        <select id="filterStatus">
          <option value="">كل الحالات</option>
          <option>قيد المراجعة</option>
          <option>مؤكد</option>
          <option>ملغي</option>
        </select>
        <select id="filterDestination">
          <option value="">كل الوجهات</option>
        </select>
      </div>
      <div class="toolbar-right">
        <!-- <button class="btn btn-ghost-dark" id="exportCsvBtn">تصدير CSV</button> -->
        <!-- <button class="btn btn-ghost-dark" id="exportJsonBtn">تصدير JSON</button> -->
        <button class="btn btn-danger" id="clearAllBtn">مسح الكل</button>
      </div>
    </section>

    <section class="table-wrap">
      <table class="bookings-table">
        <thead>
          <tr>
            <th>رقم الحجز</th>
            <th>العميل</th>
            <th>الوجهة</th>
            <th>الميعاد</th>
            <th>الأيام</th>
            <th>الأشخاص</th>
            <th>الحالة</th>
            <th>إجراءات</th>
          </tr>
        </thead>
        <tbody id="bookingsBody">
        </tbody>
      </table>
      <p class="empty-state" id="emptyState" hidden>لسه مفيش حجوزات مسجلة. أول ما حد يحجز من الموقع، هيظهر هنا.</p>
    </section>

  </main>
</div>

<!-- ===== Detail modal ===== -->
<div class="modal-overlay" id="detailModal" hidden>
  <div class="modal-card admin-detail-card" role="dialog" aria-modal="true">
    <button class="modal-close" id="closeDetail" aria-label="إغلاق">×</button>
    <h3>تفاصيل الحجز</h3>
    <dl class="detail-list" id="detailList"></dl>
    <div class="detail-actions">
      <label for="statusSelect">تحديث الحالة</label>
      <select id="statusSelect">
        <option>قيد المراجعة</option>
        <option>مؤكد</option>
        <option>ملغي</option>
      </select>
      <button class="btn btn-primary" id="saveStatusBtn">حفظ</button>
      <button class="btn btn-danger" id="deleteBookingBtn">حذف الحجز</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="db.js"></script>
<script src="admin.js"></script>
</body>
</html>
